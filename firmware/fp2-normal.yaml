# Normal profile: native zones, board controls and authenticated local OTA.
packages:
  base: !include fp2-base.yaml
  normal_interface: !include fp2-normal-interface.yaml
  board_controls: !include fp2-board-controls.yaml
  low_noise: !include fp2-low-noise.yaml

esphome:
  build_path: build/fp2

# Native LAN app updates only; stock bootloader/table and NVS guards remain.
ota:
  - platform: esphome
    id: normal_ota
    version: 2
    port: 3232
    password: !secret ota_password
    allow_partition_access: false

# OTA auto-loads safe_mode; disable its persistent boot counters explicitly.
safe_mode:
  disabled: true

# Shared sensor-bus clock.
i2c:
  frequency: 400kHz
