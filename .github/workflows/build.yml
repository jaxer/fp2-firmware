name: Build and check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ha-card/package-lock.json
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc-arm-none-eabi
          python -m pip install esphome==2026.8.2
          npm ci --prefix ha-card
      - name: Test and audit sources
        run: make area
      - name: Build ESP32 app with disposable CI credentials
        run: |
          python tools/configure.py --ci
          python tools/build_firmware.py
          mv artifacts/fp2-esp32.bin artifacts/fp2-esp32-CI-NOT-FOR-INSTALL.bin
      - name: Build radar extension and ESP32 RAM bridge
        run: |
          python firmware/radar_export/build.py
          python tools/build_bridge.py
      - name: Collect project-owned outputs only
        run: |
          cp ha-card/dist/fp2-local-card.js artifacts/
          cp .tools/radar-export-wrapper/export.bin artifacts/fp2-radar-monitor-extension.bin
          cp .tools/esp32-ram-xmodem-bridge/bridge.elf artifacts/fp2-ram-bridge.elf
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fp2-build-validation
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
